
services:
  server:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    environment:
      NODE_ENV: production
      DATABASE_URL: ${DATABASE_URL:-postgresql://app:app_password@db:5432/nutrisync?schema=public}
      GO_API_URL: ${GO_API_URL:-http://go-api:8080}
      PY_AI_URL: ${PY_AI_URL:-http://py-ai:8000}
    depends_on:
      db:
        condition: service_healthy
      go-api:
        condition: service_started
      py-ai:
        condition: service_started
    restart: unless-stopped

  go-api:
    build:
      context: ./services/go-api
      dockerfile: Dockerfile
    ports:
      - "8080:8080"
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql://app:app_password@db:5432/nutrisync?schema=public}
      APP_URL: ${APP_URL:-http://localhost:3000}
      PY_AI_URL: ${PY_AI_URL:-http://py-ai:8000}
      JWT_SECRET: ${JWT_SECRET:-}
      EMAIL_USER: ${EMAIL_USER:-}
      EMAIL_APP_PASSWORD: ${EMAIL_APP_PASSWORD:-}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      GITHUB_CLIENT_ID: ${GITHUB_CLIENT_ID:-}
      GITHUB_CLIENT_SECRET: ${GITHUB_CLIENT_SECRET:-}
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  py-ai:
    build:
      context: ./services/py-ai
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    environment:
      GO_API_URL: ${GO_API_URL:-http://go-api:8080}
      LLM_API_URL: ${LLM_API_URL:-http://host.docker.internal:11434/api/chat}
      LLM_MODEL: ${LLM_MODEL:-nutrisync-llama}
      LLM_API_FORMAT: ${LLM_API_FORMAT:-ollama_chat}
      LLM_TIMEOUT_SECONDS: ${LLM_TIMEOUT_SECONDS:-15.0}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      go-api:
        condition: service_started
    restart: unless-stopped

  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-app}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-app_password}
      POSTGRES_DB: ${POSTGRES_DB:-nutrisync}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    restart: unless-stopped

volumes:
  postgres_data:
